name = "subtitle"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
# Keep the *.workers.dev URL alive too — handy for testing without
# DNS in the loop.
workers_dev = true

# Serve the page + AudioWorklet as static assets.
# Any request not matched by the Worker (i.e. anything except /realtime)
# falls through to these files. Wrangler injects ASSETS as a binding so
# the Worker can also call env.ASSETS.fetch(req) explicitly.
[assets]
directory = "./public"
binding = "ASSETS"

# Custom domain — wrangler creates the DNS record + Worker hostname
# binding + issues a TLS cert all from this one route entry.
[[routes]]
pattern = "subtitles.bymarsel.me"
zone_name = "bymarsel.me"
custom_domain = true

# Observability — see realtime logs in `wrangler tail`
[observability]
enabled = true
